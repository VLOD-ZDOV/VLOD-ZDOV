<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#d2a8ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#30363d" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="900" height="240" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; }
    .line { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      4%, 30% { opacity: 1; transform: translateY(0); }
      34%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bit { animation: fall linear infinite; }
    @keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(280px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#grid)" opacity="0.55"/>
    <circle cx="700" cy="60" r="220" fill="url(#glow)">
      <animate attributeName="cx" values="700;200;700" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- falling commit dots -->
    <g class="mono" font-size="12" fill="#3fb950" opacity="0.35">
      <text x="640" class="bit" style="animation-duration:7s">0x1f</text>
      <text x="705" class="bit" style="animation-duration:9s;animation-delay:-3s">git push</text>
      <text x="790" class="bit" style="animation-duration:6s;animation-delay:-1s">fn main()</text>
      <text x="840" class="bit" style="animation-duration:8s;animation-delay:-5s">{ }</text>
      <text x="600" class="bit" style="animation-duration:10s;animation-delay:-6s">&lt;/&gt;</text>
    </g>

    <!-- window dots -->
    <circle cx="32" cy="30" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="30" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="30" r="6" fill="#27c93f"/>
    <text x="96" y="35" class="mono" font-size="13" fill="#8b949e">~/github — zsh</text>

    <text x="40" y="112" class="mono" font-size="56" font-weight="800" fill="url(#title)">VLOD-ZDOV</text>

    <g class="mono" font-size="22" fill="#c9d1d9">
      <text x="40" y="160"><tspan fill="#7ee787">$</tspan> whoami</text>
    </g>
    <g class="mono" font-size="20">
      <text x="40" y="196" class="line l1" fill="#58a6ff">Full Stack Developer · Systems · Android</text>
      <text x="40" y="196" class="line l2" fill="#d2a8ff">Rust · Kotlin · Python · Java · Go · C/C++</text>
      <text x="40" y="196" class="line l3" fill="#ffa657">Networking · Linux · Graphics · Security</text>
    </g>
    <rect x="40" y="206" width="12" height="3" fill="#c9d1d9" class="caret"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="none" stroke="#30363d"/>
</svg>
